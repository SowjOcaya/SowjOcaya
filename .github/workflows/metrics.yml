name: Update profile metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate live developer dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SowjOcaya
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: refresh profile metrics"
          template: classic
          config_timezone: Asia/Shanghai
          config_display: large
          config_animations: yes
          config_padding: 8, 12
          config_order: base.header, isocalendar, languages, habits, repositories, activity, achievements, lines

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_repositories: yes
          plugin_repositories_featured: SowjOcaya/Greymeng, SowjOcaya/discord-bot
          plugin_repositories_order: featured, pinned, starred, random

          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_visibility: all

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base
