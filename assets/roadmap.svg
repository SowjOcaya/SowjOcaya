<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Development journey</title>
  <desc id="desc">A timeline from joining GitHub in 2020 through web foundations, bots, full-stack products, AI and Android engineering.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-.45s}.p3{animation-delay:-.9s}.p4{animation-delay:-1.35s}.p5{animation-delay:-1.8s}
      @keyframes pulse{50%{transform:scale(1.3);opacity:.72}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#080b18"/>
  <path d="M105 164H1095" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <path d="M105 164H1095" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g><circle class="pulse" cx="105" cy="164" r="10" fill="#8b5cf6"/><text x="105" y="112" fill="#c4b5fd" font-size="21" font-weight="700">2020</text><text x="105" y="211" fill="#e2e8f0" font-size="15">Joined GitHub</text><text x="105" y="234" fill="#64748b" font-size="13">curiosity begins</text></g>
    <g><circle class="pulse p2" cx="350" cy="164" r="10" fill="#7c3aed"/><text x="350" y="112" fill="#c4b5fd" font-size="21" font-weight="700">2022</text><text x="350" y="211" fill="#e2e8f0" font-size="15">Web foundations</text><text x="350" y="234" fill="#64748b" font-size="13">HTML • utilities • communities</text></g>
    <g><circle class="pulse p3" cx="590" cy="164" r="10" fill="#2dd4bf"/><text x="590" y="112" fill="#99f6e4" font-size="21" font-weight="700">2023–24</text><text x="590" y="211" fill="#e2e8f0" font-size="15">Bots &amp; automation</text><text x="590" y="234" fill="#64748b" font-size="13">JavaScript • Python</text></g>
    <g><circle class="pulse p4" cx="835" cy="164" r="10" fill="#14b8a6"/><text x="835" y="112" fill="#99f6e4" font-size="21" font-weight="700">2025</text><text x="835" y="211" fill="#e2e8f0" font-size="15">Live web products</text><text x="835" y="234" fill="#64748b" font-size="13">React • TypeScript • Vercel</text></g>
    <g><circle class="pulse p5" cx="1095" cy="164" r="10" fill="#f97316"/><text x="1095" y="112" fill="#fed7aa" font-size="21" font-weight="700">2026+</text><text x="1095" y="211" fill="#e2e8f0" font-size="15">Full stack + Android</text><text x="1095" y="234" fill="#64748b" font-size="13">AI • cloud • Kotlin • Compose</text></g>
    <text x="600" y="295" fill="#475569" font-size="13" letter-spacing="2">LEARN  •  BUILD  •  SHIP  •  IMPROVE</text>
  </g>
</svg>
