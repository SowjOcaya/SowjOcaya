<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sowj Ocaya</title>
  <desc id="desc">Full-stack and Android developer building products from interface to infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060817"/>
      <stop offset="0.52" stop-color="#11102d"/>
      <stop offset="1" stop-color="#071e25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity=".08"/>
    </pattern>
    <style>
      .orb{animation:drift 8s ease-in-out infinite alternate;transform-origin:center}
      .orb2{animation-delay:-3s;animation-duration:11s}
      .cursor{animation:blink 1s steps(2,end) infinite}
      .line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s ease-out forwards}
      .chip{animation:float 4s ease-in-out infinite}.c2{animation-delay:-1s}.c3{animation-delay:-2s}
      @keyframes drift{to{transform:translate(55px,-22px) scale(1.12)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes float{50%{transform:translateY(-7px)}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle class="orb" cx="1050" cy="80" r="240" fill="url(#glow)" filter="url(#blur)"/>
  <circle class="orb orb2" cx="120" cy="390" r="190" fill="#0d9488" opacity=".16" filter="url(#blur)"/>
  <path class="line" d="M80 314C280 345 350 276 523 302S835 382 1120 288" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".6"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="78" y="78" fill="#2dd4bf" font-size="18" letter-spacing="3">HELLO, WORLD — I'M</text>
    <text x="72" y="170" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="72" font-weight="800" letter-spacing="-2">SOWJ OCAYA</text>
    <rect x="78" y="197" width="570" height="4" rx="2" fill="url(#accent)"/>
    <text x="78" y="244" fill="#cbd5e1" font-size="23">Full-stack Developer  •  Android Builder</text>
    <text x="78" y="280" fill="#94a3b8" font-size="17">Ideas → interfaces → APIs → products</text>
    <rect class="cursor" x="519" y="262" width="11" height="22" rx="1" fill="#a78bfa"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600">
    <g class="chip"><rect x="744" y="116" width="128" height="44" rx="22" fill="#111827" stroke="#8b5cf6"/><text x="808" y="143" text-anchor="middle" fill="#ddd6fe">KOTLIN</text></g>
    <g class="chip c2"><rect x="890" y="174" width="142" height="44" rx="22" fill="#111827" stroke="#2dd4bf"/><text x="961" y="201" text-anchor="middle" fill="#99f6e4">TYPESCRIPT</text></g>
    <g class="chip c3"><rect x="740" y="235" width="126" height="44" rx="22" fill="#111827" stroke="#f97316"/><text x="803" y="262" text-anchor="middle" fill="#fed7aa">ANDROID</text></g>
    <g class="chip c2"><rect x="891" y="292" width="134" height="44" rx="22" fill="#111827" stroke="#a78bfa"/><text x="958" y="319" text-anchor="middle" fill="#ddd6fe">NEXT.JS</text></g>
  </g>
  <text x="78" y="374" fill="#64748b" font-family="ui-monospace,monospace" font-size="14">github.com/SowjOcaya  //  building since 2020</text>
</svg>
